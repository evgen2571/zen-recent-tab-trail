name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check recent-tab-trail.uc.js
      - run: node --check tools/install-local.mjs
      - run: node --test tests/*.test.cjs
